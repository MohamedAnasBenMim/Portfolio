<div class="container-fluid">
  <div class="row p-30-0">
    <div class="col-md-3 col-6">
      <div class="art-counter-frame">
        <div class="art-counter-box">
          <span class="art-counter">{{getExperienceYears()}}</span><span class="art-counter-plus">+</span>
        </div>
        <h6>Years Experience</h6>
      </div>
    </div>

    <div class="col-md-3 col-6">
      <div class="art-counter-frame">
        <div class="art-counter-box">
          <span class="art-counter">{{getCompletedProjectsCount()}}</span><span class="art-counter-plus">+</span>
        </div>
        <h6>Completed Projects</h6>
      </div>
    </div>

    <div class="col-md-3 col-6">
      <div class="art-counter-frame">
        <div class="art-counter-box">
          <span class="art-counter">{{getCustomersCount()}}</span><span class="art-counter-plus">+</span>
        </div>
        <h6>LeetCode &amp; Codeforces Problems</h6>
      </div>
    </div>

    <div class="col-md-3 col-6">
      <div class="art-counter-frame">
        <div class="art-counter-box">
          <span class="art-counter">10</span><span class="art-counter-plus">+</span>
        </div>
        <h6>Certificates &amp; Awards</h6>
      </div>
    </div>
  </div>
</div>
