<!-- container -->
<div class="container-fluid">

  <!-- row -->
  <div class="row p-30-0">

    <!-- col -->
    <div class="col-lg-11">

      <!-- section title -->
      <div class="art-section-title">
        <!-- title frame -->
        <div class="art-title-frame">
          <!-- title -->
          <h4>Achievements</h4>
        </div>
        <!-- title frame end -->
      </div>
      <!-- section title end -->

      <!-- timeline -->
      <div class="art-timeline">


        <div *ngFor="let certificate of certificates" class="art-timeline-item">
          <div class="art-timeline-mark-light"></div>
          <div class="art-timeline-mark"></div>

          <div class="art-a art-timeline-content">
            <div class="art-card-header">
              <div class="art-left-side">
                <h5>{{certificate.name}}</h5>
                <div class="art-el-suptitle mb-15">{{certificate.organization}}</div>
              </div>
              <div class="art-right-side">
                <span class="art-date">{{certificate.issuedDate | date:'MMM y'}} - {{ certificate.expiryDate | date:'MMM y'}}</span>
              </div>
            </div>
            <h6>Description:</h6>
            <span>{{certificate.description}}</span>
            <!-- <h6>Credential ID:</h6>
            <span>{{certificate.credentialId}}</span> -->
            <h6>Url:</h6><a href="{{certificate.url}}" target="_blank" rel="noopener noreferrer" data-no-swup>{{certificate.url}}</a>
            <div *ngIf="certificate.url === 'https://education.gov.tn/?lang=fr'" style="margin-top: 12px;">
              <img src="/assets/iau-achievement.jpg" alt="IAU achievement" style="max-width: 100%; height: auto; border-radius: 8px;">
            </div>
            <div *ngIf="certificate.url === 'https://events.vtools.ieee.org/m/513934'" style="margin-top: 12px;">
              <img src="/assets/wiempower-team.jpg" alt="WIEMPOWER team" style="max-width: 100%; height: auto; border-radius: 8px;">
            </div>
            <h6 *ngIf="certificate.credentialId && certificate.credentialId !== 'Links'">Certificate:</h6>
            <a *ngIf="certificate.credentialId && certificate.credentialId !== 'Links'" [href]="certificate.credentialId" target="_blank" rel="noopener noreferrer" data-no-swup download>Open certificate PDF</a>
            <div *ngIf="certificate.url === 'https://icpc.global/regionals/finder/TCPC'" style="margin-top: 12px;">
              <img src="/assets/tcpc-team.jpg" alt="TCPC team" style="max-width: 100%; height: auto; border-radius: 8px;">
            </div>
          </div>
        </div>

      </div>
      <!-- timeline end -->

    </div>
    <!-- col end -->

  </div>
  <!-- row end -->

</div>
<!-- container end -->
